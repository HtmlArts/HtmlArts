<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HtmlArts · Magazine Reader</title>
<style>
/* =========================================================
   01. DESIGN TOKENS & 4 EDITORIAL READING THEMES
   ========================================================= */
:root {
  color-scheme: dark;
  --header-h: 56px;
  --footer-h: 54px;
  --font-serif: Georgia, 'Playfair Display', 'Times New Roman', serif;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
  font-family: var(--font-sans);
  user-select: none;
  -webkit-user-select: none;
}

/* 4 Distinct Editorial Themes (Adapted from Reference Architecture) */
body.theme-cream {
  --desk-bg: #111820; --paper-bg: #f7f4ec; --paper-text: #18212b;
  --paper-border: #d9d2c4; --paper-sub: #596575; --paper-card: #eee9dd;
  --paper-accent: #b54b32; --lead-quote: #b54b32; --book-edge: #d5cbbb;
  --spine-shadow: rgba(31,25,20,.22); --bar-bg: rgba(15, 23, 42, 0.94);
  --bar-text: #f1f5f9; --bar-border: rgba(255, 255, 255, 0.12);
}
body.theme-velvet {
  --desk-bg: #090d13; --paper-bg: #111923; --paper-text: #edf0f2;
  --paper-border: #2b3947; --paper-sub: #a2afbd; --paper-card: #192431;
  --paper-accent: #e1a45b; --lead-quote: #e1a45b; --book-edge: #25313d;
  --spine-shadow: rgba(0,0,0,.65); --bar-bg: rgba(9, 13, 19, 0.96);
  --bar-text: #f8fafc; --bar-border: rgba(255, 255, 255, 0.10);
}
body.theme-white {
  --desk-bg: #e2e8f0; --paper-bg: #ffffff; --paper-text: #17212b;
  --paper-border: #dbe1e4; --paper-sub: #63717c; --paper-card: #f8fafc;
  --paper-accent: #2563eb; --lead-quote: #2563eb; --book-edge: #cbd5e1;
  --spine-shadow: rgba(0,0,0,.12); --bar-bg: rgba(255, 255, 255, 0.94);
  --bar-text: #0f172a; --bar-border: rgba(0, 0, 0, 0.12);
}
body.theme-cyber {
  --desk-bg: #071316; --paper-bg: #0b1719; --paper-text: #e7f3ef;
  --paper-border: #254346; --paper-sub: #91b4b0; --paper-card: #112426;
  --paper-accent: #4ed0bd; --lead-quote: #4ed0bd; --book-edge: #183638;
  --spine-shadow: rgba(0,0,0,.7); --bar-bg: rgba(7, 19, 22, 0.96);
  --bar-text: #e7f3ef; --bar-border: rgba(78, 208, 189, 0.25);
}

body {
  background-color: var(--desk-bg);
  color: var(--paper-text);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: background-color 0.25s ease;
}

/* =========================================================
   02. MASTER READER HEADER (MINIMALIST & UNIFIED)
   ========================================================= */
#siteHeader {
  height: var(--header-h);
  width: 100%;
  background: var(--bar-bg);
  color: var(--bar-text);
  border-bottom: 1px solid var(--bar-border);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 50;
  flex-shrink: 0;
}

.header-left, .header-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.btn-index {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 12px;
  border-radius: 8px;
  background: rgba(59, 130, 246, 0.15);
  border: 1px solid rgba(59, 130, 246, 0.35);
  color: #60a5fa;
  font: 700 12px var(--font-sans);
  cursor: pointer;
  letter-spacing: .03em;
  transition: background .15s, transform .15s;
}
.btn-index:hover {
  background: rgba(59, 130, 246, 0.25);
}
.btn-index:active {
  transform: scale(0.96);
}

.header-sep {
  width: 1px;
  height: 18px;
  background: var(--bar-border);
  margin: 0 4px;
}

.book-title-meta {
  display: flex;
  align-items: center;
  gap: 8px;
}
#bookTitle {
  font: 800 14px var(--font-sans);
  letter-spacing: .02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: clamp(140px, 28vw, 380px);
}
#bookBadge {
  font: 700 10px var(--font-mono);
  padding: 2px 7px;
  border-radius: 4px;
  border: 1px solid var(--bar-border);
  opacity: 0.8;
  white-space: nowrap;
}

.header-icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  border: 1px solid var(--bar-border);
  background: rgba(255, 255, 255, 0.06);
  color: var(--bar-text);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background .15s, color .15s, transform .15s;
}
.header-icon-btn:hover {
  background: rgba(255, 255, 255, 0.14);
}
.header-icon-btn.active {
  background: #2563eb;
  color: #fff;
  border-color: #3b82f6;
  box-shadow: 0 0 12px rgba(37, 99, 235, 0.4);
}
.header-icon-btn svg {
  width: 17px;
  height: 17px;
}

/* =========================================================
   03. FLOATING ANNOTATION PALETTE
   ========================================================= */
#folioPenPalette {
  position: fixed;
  top: 68px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(15, 23, 42, 0.96);
  border: 1px solid rgba(255, 255, 255, 0.2);
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  border-radius: 999px;
  padding: 6px 14px;
  display: flex;
  align-items: center;
  gap: 9px;
  z-index: 60;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: opacity .2s, transform .2s;
}
#folioPenPalette.hide {
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, -20px);
}
.ink-color-btn {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.4);
  cursor: pointer;
  transition: transform .15s;
}
.ink-color-btn:hover {
  transform: scale(1.15);
}
.ink-color-btn.active {
  transform: scale(1.22);
  border-color: #fff;
  box-shadow: 0 0 0 2px #3b82f6;
}
.palette-btn {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: #cbd5e1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background .15s, color .15s;
}
.palette-btn:hover {
  background: rgba(255, 255, 255, 0.12);
  color: #fff;
}
.palette-btn.active {
  background: #2563eb;
  color: #fff;
}
.palette-btn svg { width: 14px; height: 14px; }
.btn-clear-ink {
  font: 700 10px var(--font-mono);
  color: #fca5a5;
  background: rgba(239, 68, 68, 0.2);
  border: 1px solid rgba(239, 68, 68, 0.35);
  padding: 3px 8px;
  border-radius: 6px;
  cursor: pointer;
}
.btn-clear-ink:hover {
  background: rgba(239, 68, 68, 0.35);
}

/* =========================================================
   04. 3D BOOK STAGE & CASING (PAGINATED & CONTINUOUS)
   ========================================================= */
#bookStage {
  flex: 1;
  width: 100%;
  height: calc(100vh - var(--header-h) - var(--footer-h));
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: clamp(8px, 2.5vw, 32px);
  perspective: 2200px;
  overflow: hidden;
  touch-action: pan-y;
}

#bookStage.pan-mode {
  cursor: grab;
}
#bookStage.pan-mode:active {
  cursor: grabbing;
}

.book-chassis {
  position: relative;
  max-width: 1040px;
  width: 100%;
  height: 100%;
  border-radius: 6px 16px 16px 6px;
  box-shadow: 0 35px 90px rgba(0,0,0,0.45), 0 5px 20px rgba(0,0,0,0.3);
  transform-style: preserve-3d;
  display: flex;
  align-items: center;
  justify-content: center;
}
.book-chassis::before {
  content: ''; position: absolute; top: 6px; bottom: 6px; left: -14px; width: 14px;
  background: linear-gradient(to right, #080a0e 0%, #1f293d 50%, #111726 100%);
  border-radius: 4px 0 0 4px; box-shadow: inset 2px 0 4px rgba(0,0,0,0.7); z-index: 1;
}
.book-chassis::after {
  content: ''; position: absolute; right: -10px; top: 8px; bottom: 8px; width: 10px;
  background: repeating-linear-gradient(to bottom, var(--book-edge), var(--book-edge) 2px, rgba(0,0,0,0.2) 3px);
  border-radius: 0 4px 4px 0; box-shadow: 2px 0 5px rgba(0,0,0,0.35); z-index: 1;
}

.page-sheet {
  position: relative;
  width: 100%;
  height: 100%;
  background-color: var(--paper-bg);
  color: var(--paper-text);
  border: 1px solid var(--paper-border);
  border-radius: 4px 16px 16px 4px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  transform-origin: left center;
  transform-style: preserve-3d;
  backface-visibility: hidden;
  will-change: transform, opacity;
  transition: transform 0.55s cubic-bezier(0.22, 0.78, 0.18, 1), opacity 0.55s ease;
}
.page-sheet.turn-left {
  transform: rotateY(-105deg) scale(0.97);
  opacity: 0;
}
.page-sheet.turn-right {
  transform-origin: right center;
  transform: rotateY(105deg) scale(0.97);
  opacity: 0;
}
.page-sheet.rest {
  transform: rotateY(0deg) scale(1);
  opacity: 1;
}

.gutter-crease {
  position: absolute; left: 0; top: 0; bottom: 0; width: 26px;
  background: linear-gradient(to right, var(--spine-shadow) 0%, transparent 100%);
  pointer-events: none; z-index: 20; opacity: 0.6;
}

/* Editorial Folio Header & Footer */
.folio-header-strip {
  padding: 16px 28px 12px;
  border-bottom: 1px solid var(--paper-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.folio-header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.folio-header-icon {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  background: var(--paper-card);
  color: var(--paper-accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: bold;
}
.folio-header-cat {
  font: 700 9px var(--font-mono);
  text-transform: uppercase;
  letter-spacing: .12em;
  color: var(--paper-accent);
}
.folio-header-title {
  font: 700 16px var(--font-serif);
  line-height: 1.15;
}
.folio-header-count {
  font: 700 12px var(--font-mono);
  color: var(--paper-sub);
}

.folio-body {
  padding: 24px 32px;
  flex: 1;
  overflow-y: auto;
  font-family: var(--font-serif);
  line-height: 1.75;
}
.folio-body::-webkit-scrollbar { width: 5px; }
.folio-body::-webkit-scrollbar-thumb { background: rgba(160, 160, 160, 0.25); border-radius: 4px; }

.folio-footer-strip {
  padding: 10px 28px;
  border-top: 1px solid var(--paper-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font: 10px var(--font-mono);
  color: var(--paper-sub);
  flex-shrink: 0;
}

/* Vector Ink Canvas */
#pageInkCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 25;
  pointer-events: none;
  touch-action: none;
}
#pageInkCanvas.is-drawing {
  pointer-events: auto;
  cursor: crosshair;
}

/* Continuous Scroll Mode */
body.mode-continuous #bookStage {
  overflow-y: auto !important;
  display: block !important;
}
body.mode-continuous .book-chassis {
  max-width: 920px;
  margin: 0 auto;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
body.mode-continuous .book-chassis::before,
body.mode-continuous .book-chassis::after { display: none; }
body.mode-continuous .page-sheet {
  transform: none !important;
  opacity: 1 !important;
  min-height: 75vh;
  margin-bottom: 24px;
}

/* =========================================================
   05. BOTTOM TIMELINE SCRUBBER
   ========================================================= */
#siteFooter {
  height: var(--footer-h);
  width: 100%;
  background: var(--bar-bg);
  color: var(--bar-text);
  border-top: 1px solid var(--bar-border);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  padding: 0 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  z-index: 50;
  flex-shrink: 0;
}

.footer-left {
  display: flex;
  align-items: center;
  gap: 6px;
  font: 700 11px var(--font-mono);
  min-width: 80px;
}
#readPercentage { color: #60a5fa; }

.footer-center {
  flex: 1;
  max-width: 540px;
  margin: 0 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.stepper-btn {
  background: transparent;
  border: none;
  color: var(--bar-text);
  opacity: 0.7;
  cursor: pointer;
  display: grid;
  place-items: center;
  padding: 4px;
  transition: opacity .15s, transform .15s;
}
.stepper-btn:hover { opacity: 1; transform: scale(1.1); }
.stepper-btn svg { width: 15px; height: 15px; }

#timelineRange {
  width: 100%;
  height: 4px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.2);
  outline: none;
  cursor: pointer;
  accent-color: #3b82f6;
}

.footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  font: 700 11px var(--font-mono);
}
#nodeCategoryBadge {
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(59, 130, 246, 0.2);
  color: #93c5fd;
  border: 1px solid rgba(59, 130, 246, 0.35);
  text-transform: uppercase;
}

/* =========================================================
   06. TABLE OF CONTENTS DRAWER
   ========================================================= */
#tocDrawer {
  position: fixed;
  inset-y: 0;
  left: 0;
  width: min(380px, 86vw);
  background: rgba(15, 23, 42, 0.98);
  color: #f8fafc;
  border-right: 1px solid rgba(255, 255, 255, 0.14);
  box-shadow: 25px 0 60px rgba(0,0,0,0.6);
  transform: translateX(-100%);
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  z-index: 80;
  display: flex;
  flex-direction: column;
}
#tocDrawer.open { transform: translateX(0); }

.toc-header {
  padding: 16px 20px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.toc-header h3 {
  font: 800 14px var(--font-sans);
  text-transform: uppercase;
  letter-spacing: .08em;
}
.toc-close-btn {
  background: transparent;
  border: none;
  color: #94a3b8;
  cursor: pointer;
  padding: 4px;
}
.toc-close-btn:hover { color: #fff; }
.toc-close-btn svg { width: 18px; height: 18px; }

.toc-search-wrap {
  padding: 12px 16px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  background: rgba(0,0,0,0.25);
}
#tocSearch {
  width: 100%;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 8px;
  padding: 8px 12px;
  color: #fff;
  font: 12px var(--font-mono);
  outline: none;
}
#tocSearch:focus { border-color: #3b82f6; }

#tocList {
  flex: 1;
  overflow-y: auto;
  padding: 10px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.toc-item {
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  color: #cbd5e1;
  transition: background .15s, color .15s;
}
.toc-item:hover, .toc-item.active {
  background: rgba(255, 255, 255, 0.12);
  color: #fff;
}
.toc-item-left {
  display: flex;
  align-items: center;
  gap: 10px;
  overflow: hidden;
}
.toc-num {
  font: 700 11px var(--font-mono);
  color: #60a5fa;
  min-width: 22px;
}
.toc-name {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.toc-tag {
  font: 700 9px var(--font-mono);
  padding: 2px 6px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.08);
  color: #94a3b8;
  text-transform: uppercase;
}

#tocBackdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  backdrop-filter: blur(4px);
  z-index: 75;
  display: none;
}
#tocBackdrop.open { display: block; }

/* Zen Viewport Mode */
body.zen-mode #siteHeader,
body.zen-mode #siteFooter { display: none !important; }
body.zen-mode #bookStage { height: 100dvh !important; padding: 0 !important; }
body.zen-mode .book-chassis { max-width: 100vw !important; height: 100% !important; border-radius: 0 !important; }
body.zen-mode .page-sheet { border-radius: 0 !important; border: none !important; }
#btnExitZen {
  display: none;
  position: fixed;
  top: 14px;
  right: 14px;
  z-index: 90;
  padding: 7px 14px;
  border-radius: 999px;
  background: rgba(15, 23, 42, 0.9);
  color: #f1f5f9;
  border: 1px solid rgba(255, 255, 255, 0.2);
  font: 700 11px var(--font-mono);
  cursor: pointer;
}
body.zen-mode #btnExitZen { display: flex; align-items: center; gap: 6px; }

/* Standalone Fallback Dropzone */
#dropFallback {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--desk-bg);
  z-index: 100;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
}
#dropFallback.open { display: flex; }
.drop-box {
  width: min(420px, 92vw);
  padding: 48px 24px;
  border: 2px dashed rgba(255, 255, 255, 0.25);
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.04);
  cursor: pointer;
}
.drop-box:hover { border-color: #3b82f6; background: rgba(59, 130, 246, 0.08); }
</style>

          <path d="M18 11V6a2 2 0 0 0-4 0v5"/>

      <button class="header-icon-btn" id="btnTheme" title="Cycle Reading Theme Tint (T)">

          <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/>
          <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/>
          <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/>
          <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/>
          <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.8-.7 1.8-1.5 0-.4-.2-.8-.4-1.1-.3-.4-.4-.8-.4-1.4 0-1.1.9-2 2-2h2.3c3.7 0 6.7-3 6.7-6.7C22 5.6 17.5 2 12 2z"/>
        </svg>
      </button>

      <!-- Zen Fullscreen -->
      <button class="header-icon-btn" id="btnZen" title="Zen Fullscreen View (F)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
        </svg>
      </button>

      <!-- Download Book -->
      <button class="header-icon-btn" id="btnDownload" title="Download Standalone Book HTML">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </button>

      <div class="header-sep"></div>

      <!-- Close Reader Shell (Emits close event to parent) -->
      <button class="header-icon-btn" id="btnClose" title="Close Reader (Esc)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ======================================================== -->
  <!-- 2. FLOATING ANNOTATION PALETTE                           -->
  <!-- ======================================================== -->
  <aside id="folioPenPalette" class="hide" role="toolbar" aria-label="Ink Tools">
    <button type="button" class="ink-color-btn active" data-color="#18212b" style="background:#18212b" title="Black Ink"></button>
    <button type="button" class="ink-color-btn" data-color="#dc2626" style="background:#dc2626" title="Red Ink"></button>
    <button type="button" class="ink-color-btn" data-color="#2563eb" style="background:#2563eb" title="Blue Ink"></button>
    <button type="button" class="ink-color-btn" data-color="#16a34a" style="background:#16a34a" title="Emerald Ink"></button>
    <button type="button" class="ink-color-btn" data-color="#eab308" style="background:#eab308" title="Yellow Highlighter"></button>

    <div class="header-sep"></div>

    <button type="button" class="palette-btn" id="inkEraserBtn" title="Eraser (E)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m7 21 3-3"/><path d="M18.4 3.6a2.1 2.1 0 0 1 3 3l-10 10-6.4 1.2 1.2-6.4z"/>
      </svg>
    </button>
    <button type="button" class="palette-btn" id="inkUndoBtn" title="Undo (Ctrl+Z)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
      </svg>
    </button>
    <button type="button" class="palette-btn" id="inkRedoBtn" title="Redo (Ctrl+Y)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/>
      </svg>
    </button>

    <button type="button" class="btn-clear-ink" id="clearInkBtn" title="Clear folio ink">Clear</button>
  </aside>

  <!-- ======================================================== -->
  <!-- 3. MAIN BOOK STAGE (3D PAGINATED & CONTINUOUS MODES)     -->
  <!-- ======================================================== -->
  <main id="bookStage">
    <div class="book-chassis" id="bookChassis">
      <article class="page-sheet rest" id="activeBookPage">
        <div class="gutter-crease"></div>
        <div id="folioContentSlot" style="height:100%;display:flex;flex-direction:column">
          <!-- Dynamic folio rendered here -->
        </div>
        <canvas id="pageInkCanvas"></canvas>
      </article>
    </div>

    <!-- Floating Exit Zen Button -->
    <button id="btnExitZen">
      <span>Exit Fullscreen</span>
    </button>
  </main>

  <!-- ======================================================== -->
  <!-- 4. BOTTOM TIMELINE SCRUBBER                              -->
  <!-- ======================================================== -->
  <footer id="siteFooter">
    <div class="footer-left">
      <span>Read:</span>
      <span id="readPercentage">0%</span>
    </div>

    <div class="footer-center">
      <button class="stepper-btn" id="btnFirstPage" title="First Cover">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/>
        </svg>
      </button>

      <input type="range" id="timelineRange" min="0" max="0" value="0" step="1">

      <button class="stepper-btn" id="btnLastPage" title="Last Folio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/>
        </svg>
      </button>
    </div>

    <div class="footer-right">
      <span id="nodeCategoryBadge">SPECIAL EDITION</span>
      <span id="folioCountDisplay">1 / 1</span>
    </div>
  </footer>

  <!-- ======================================================== -->
  <!-- 5. TABLE OF CONTENTS DRAWER                              -->
  <!-- ======================================================== -->
  <div id="tocBackdrop"></div>
  <aside id="tocDrawer" aria-label="Table of Contents">
    <div class="toc-header">
      <h3>Chapter Index</h3>
      <button class="toc-close-btn" id="btnTocClose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="toc-search-wrap">
      <input type="text" id="tocSearch" placeholder="Search chapters & topics...">
    </div>

    <div id="tocList">
      <!-- Populated dynamically from book folios -->
    </div>
  </aside>

  <!-- ======================================================== -->
  <!-- 6. STANDALONE FILE DROPZONE (FALLBACK)                   -->
  <!-- ======================================================== -->
  <div id="dropFallback">
    <div class="drop-box" id="dropzoneBox">
      <div style="font-size:38px;margin-bottom:12px">📖</div>
      <h2 style="font:700 20px var(--font-serif);color:#fff;margin-bottom:6px">HtmlArts Magazine Reader</h2>
      <p style="font:13px var(--font-sans);color:#94a3b8">Drop any .html book file here or click to browse</p>
    </div>
    <input type="file" id="fileInputFallback" accept=".html,.htm" style="display:none">
  </div>

<script>
(()=>{
  'use strict';
  const $ = id => document.getElementById(id);
  const isEmbedded = window.parent !== window;

  // State
  let bookId = 'book-01';
  let folios = [];
  let curIndex = 0;
  let isFlipping = false;
  let readingMode = 'paginated'; // 'paginated' or 'continuous'
  let isPanMode = false;
  let rawBookHtml = '';

  const themes = ['theme-cream', 'theme-velvet', 'theme-white', 'theme-cyber'];
  let currentThemeIdx = 0;

  // Pen Annotation State
  let inkEnabled = false;
  let eraserActive = false;
  let currentInkColor = '#18212b';
  let currentInkWidth = 2.8;
  let activeStroke = null;
  let pageStrokes = {}; // bookId_folioIndex -> Array of strokes
  let currentRedo = [];

  const stage = $('bookStage');
  const chassis = $('bookChassis');
  const activePage = $('activeBookPage');
  const slot = $('folioContentSlot');
  const inkCanvas = $('pageInkCanvas');
  const inkCtx = inkCanvas.getContext('2d');
  const penPalette = $('folioPenPalette');

  const titleEl = $('bookTitle');
  const badgeEl = $('bookBadge');
  const catBadge = $('nodeCategoryBadge');
  const countDisplay = $('folioCountDisplay');
  const pctDisplay = $('readPercentage');
  const rangeInput = $('timelineRange');

  /* ── 1. Book Parsing & Folio Extraction ── */
  function extractFolios(rawHtml, metadata = {}) {
    rawBookHtml = rawHtml;
    const parser = new DOMParser();
    const doc = parser.parseFromString(rawHtml, 'text/html');

    const title = metadata.title || doc.querySelector('title')?.textContent?.trim() || 'HtmlArts Publication';
    titleEl.textContent = title;

    // Check for explicit <article class="page"> or <section class="page">
    const pageNodes = doc.querySelectorAll('article.page, section.page, .stage > article, .stage > section');
    const parsed = [];

    if (pageNodes.length > 0) {
      pageNodes.forEach((node, idx) => {
        const cat = node.dataset.category || node.querySelector('.meta span:first-child')?.textContent?.trim() || metadata.category || 'Chapter';
        const name = node.dataset.name || node.querySelector('h1, h2')?.textContent?.trim() || `Folio ${idx + 1}`;
        const isCover = node.classList.contains('cover') || idx === 0;
        parsed.push({
          id: node.id || `folio-${idx}`,
          title: name,
          category: cat,
          isCover,
          content: node.innerHTML
        });
      });
    } else {
      // Chunk headings & paragraphs
      const headings = doc.querySelectorAll('h1, h2, h3, h4');
      if (headings.length > 0) {
        headings.forEach((h, idx) => {
          let body = '';
          let sib = h.nextElementSibling;
          let count = 0;
          while (sib && count < 4 && !['H1','H2','H3','H4'].includes(sib.tagName)) {
            body += sib.outerHTML;
            sib = sib.nextElementSibling;
            count++;
          }
          parsed.push({
            id: `folio-${idx}`,
            title: h.textContent.trim() || `Section ${idx + 1}`,
            category: metadata.category || 'Reading',
            isCover: idx === 0,
            content: `<h2>${h.textContent}</h2>${body}`
          });
        });
      } else {
        // Fallback: single folio
        parsed.push({
          id: 'folio-0',
          title: title,
          category: metadata.category || 'Document',
          isCover: false,
          content: doc.body ? doc.body.innerHTML : rawHtml
        });
      }
    }

    folios = parsed;
    badgeEl.textContent = `${folios.length} FOLIOS`;
    rangeInput.max = Math.max(0, folios.length - 1);
    buildToc();
    jump(0, 'none');
  }

  /* ── 2. Table of Contents Builder ── */
  function buildToc() {
    const list = $('tocList');
    list.innerHTML = '';
    folios.forEach((f, idx) => {
      const item = document.createElement('div');
      item.className = 'toc-item' + (idx === curIndex ? ' active' : '');
      item.innerHTML = `
        <div class="toc-item-left">
          <span class="toc-num">${String(idx + 1).padStart(2, '0')}</span>
          <span class="toc-name">${escapeHtml(f.title)}</span>
        </div>
        <span class="toc-tag">${escapeHtml(f.category)}</span>
      `;
      item.onclick = () => {
        jump(idx, idx > curIndex ? 'forward' : 'backward');
        closeToc();
      };
      list.appendChild(item);
    });
  }

  function filterToc(term) {
    const items = $('tocList').querySelectorAll('.toc-item');
    items.forEach(it => {
      it.style.display = it.textContent.toLowerCase().includes(term.toLowerCase()) ? 'flex' : 'none';
    });
  }

  function openToc() {
    $('tocDrawer').classList.add('open');
    $('tocBackdrop').classList.add('open');
    $('tocSearch').focus();
  }
  function closeToc() {
    $('tocDrawer').classList.remove('open');
    $('tocBackdrop').classList.remove('open');
  }

  /* ── 3. Folio Renderer (Paginated 3D vs Continuous) ── */
  function renderFolioContent(folio, idx) {
    if (folio.isCover) {
      return `
        <div class="gutter-crease"></div>
        <div class="inner" style="height:100%;padding:clamp(24px,5vw,56px);display:flex;flex-direction:column;justify-content:space-between">
          ${folio.content}
        </div>
      `;
    }
    return `
      <div class="gutter-crease"></div>
      <div class="folio-header-strip">
        <div class="folio-header-left">
          <div class="folio-header-icon">${String(idx + 1).padStart(2, '0')}</div>
          <div>
            <div class="folio-header-cat">${escapeHtml(folio.category)}</div>
            <div class="folio-header-title">${escapeHtml(folio.title)}</div>
          </div>
        </div>
        <div class="folio-header-count">${String(idx + 1).padStart(2, '0')} / ${folios.length}</div>
      </div>
      <div class="folio-body">
        ${folio.content}
      </div>
      <div class="folio-footer-strip">
        <span>HtmlArts • Spec Edition</span>
        <span>Flip or Swipe to turn →</span>
      </div>
    `;
  }

  function jump(index, dir = 'forward') {
    if (index < 0 || index >= folios.length || isFlipping) return;
    isFlipping = true;
    curIndex = index;

    if (readingMode === 'continuous') {
      const target = document.querySelector(`[data-folio-index="${curIndex}"]`);
      if (target) target.scrollIntoView({ behavior: 'smooth' });
      isFlipping = false;
      updateUI();
      return;
    }

    if (dir === 'forward') {
      activePage.classList.remove('rest', 'turn-right');
      activePage.classList.add('turn-left');
    } else if (dir === 'backward') {
      activePage.classList.remove('rest', 'turn-left');
      activePage.classList.add('turn-right');
    }

    setTimeout(() => {
      const f = folios[curIndex];
      slot.innerHTML = renderFolioContent(f, curIndex);
      activePage.classList.remove('turn-left', 'turn-right');
      activePage.classList.add('rest');

      resizeInkCanvas();
      loadFolioStrokes();
      updateUI();
      emitFolioEvent();

      setTimeout(() => { isFlipping = false; }, 300);
    }, dir === 'none' ? 0 : 220);
  }

  function updateUI() {
    const pct = folios.length > 1 ? Math.round((curIndex / (folios.length - 1)) * 100) : 100;
    pctDisplay.textContent = `${pct}%`;
    rangeInput.value = curIndex;
    countDisplay.textContent = `${String(curIndex + 1).padStart(2, '0')} / ${folios.length}`;
    if (folios[curIndex]) catBadge.textContent = folios[curIndex].category;

    // Update active in TOC
    const items = $('tocList').querySelectorAll('.toc-item');
    items.forEach((it, idx) => it.classList.toggle('active', idx === curIndex));
  }

  function emitFolioEvent() {
    if (isEmbedded) {
      window.parent.postMessage({
        type: 'HTMLARTS_EVENT',
        payload: {
          event: 'folio-changed',
          bookId,
          folioIndex: curIndex,
          totalFolios: folios.length,
          folioTitle: folios[curIndex]?.title || ''
        }
      }, '*');
    }
  }

  /* ── 4. Transparent Vector Ink Layer ── */
  function sizeCanvas() {
    if (!activePage) return;
    const rect = activePage.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    inkCanvas.width = Math.round(rect.width * dpr);
    inkCanvas.height = Math.round(rect.height * dpr);
    inkCanvas.style.width = rect.width + 'px';
    inkCanvas.style.height = rect.height + 'px';
    inkCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function resizeInkCanvas() {
    sizeCanvas();
    redrawInk();
  }

  function getFolioKey() {
    return `${bookId}_folio_${curIndex}`;
  }

  function loadFolioStrokes() {
    const k = getFolioKey();
    if (!pageStrokes[k]) {
      try {
        pageStrokes[k] = JSON.parse(localStorage.getItem('htmlarts_ink_' + k) || '[]');
      } catch(e) { pageStrokes[k] = []; }
    }
    redrawInk();
  }

  function saveFolioStrokes() {
    const k = getFolioKey();
    try {
      localStorage.setItem('htmlarts_ink_' + k, JSON.stringify(pageStrokes[k] || []));
    } catch(e) {}
    // Emit to host server for high-scale IndexedDB persistence
    if (isEmbedded) {
      window.parent.postMessage({
        type: 'HTMLARTS_EVENT',
        payload: {
          event: 'annotations-updated',
          bookId,
          data: { strokes: pageStrokes[k] || [] }
        }
      }, '*');
    }
  }

  function drawStroke(s) {
    if (!s || !s.pts || s.pts.length < 1) return;
    const rect = activePage.getBoundingClientRect();
    inkCtx.save();
    if (s.tool === 'highlighter') {
      inkCtx.globalCompositeOperation = 'multiply';
      inkCtx.strokeStyle = 'rgba(234, 179, 8, 0.45)';
      inkCtx.lineWidth = 16;
    } else {
      inkCtx.globalCompositeOperation = 'source-over';
      inkCtx.strokeStyle = s.color || currentInkColor;
      inkCtx.lineWidth = s.width || 2.8;
    }
    inkCtx.lineCap = 'round';
    inkCtx.lineJoin = 'round';
    inkCtx.beginPath();
    const [sx, sy] = [s.pts[0].x * rect.width, s.pts[0].y * rect.height];
    inkCtx.moveTo(sx, sy);
    for (let i = 1; i < s.pts.length; i++) {
      const px = s.pts[i].x * rect.width;
      const py = s.pts[i].y * rect.height;
      inkCtx.lineTo(px, py);
    }
    inkCtx.stroke();
    inkCtx.restore();
  }

  function redrawInk() {
    const rect = activePage.getBoundingClientRect();
    inkCtx.clearRect(0, 0, rect.width, rect.height);
    const k = getFolioKey();
    (pageStrokes[k] || []).forEach(drawStroke);
  }

  function normPos(e) {
    const r = inkCanvas.getBoundingClientRect();
    return {
      x: Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)),
      y: Math.max(0, Math.min(1, (e.clientY - r.top) / r.height))
    };
  }

  inkCanvas.addEventListener('pointerdown', e => {
    if (!inkEnabled) return;
    e.preventDefault();
    e.stopPropagation();
    if (eraserActive) { eraseNear(e); return; }
    if (inkCanvas.setPointerCapture) inkCanvas.setPointerCapture(e.pointerId);

    const isHighlighter = currentInkColor === '#eab308';
    activeStroke = {
      tool: isHighlighter ? 'highlighter' : 'pen',
      color: currentInkColor,
      width: isHighlighter ? 16 : 2.8,
      pts: [normPos(e)]
    };
  });

  inkCanvas.addEventListener('pointermove', e => {
    if (!inkEnabled) return;
    if (eraserActive && e.buttons === 1) { eraseNear(e); return; }
    if (!activeStroke) return;
    activeStroke.pts.push(normPos(e));
    redrawInk();
    drawStroke(activeStroke);
  });

  function finishStroke() {
    if (!activeStroke) return;
    const k = getFolioKey();
    if (!pageStrokes[k]) pageStrokes[k] = [];
    if (activeStroke.pts.length >= 2) {
      pageStrokes[k].push(activeStroke);
      saveFolioStrokes();
    }
    activeStroke = null;
    redrawInk();
  }
  inkCanvas.addEventListener('pointerup', finishStroke);
  inkCanvas.addEventListener('pointercancel', finishStroke);

  function eraseNear(e) {
    const k = getFolioKey();
    if (!pageStrokes[k] || pageStrokes[k].length === 0) return;
    const p = normPos(e);
    const hitIdx = pageStrokes[k].findIndex(s => {
      return s.pts.some(pt => Math.hypot(pt.x - p.x, pt.y - p.y) < 0.035);
    });
    if (hitIdx !== -1) {
      currentRedo.push(pageStrokes[k].splice(hitIdx, 1)[0]);
      saveFolioStrokes();
      redrawInk();
    }
  }

  function undoStroke() {
    const k = getFolioKey();
    if (pageStrokes[k] && pageStrokes[k].length > 0) {
      currentRedo.push(pageStrokes[k].pop());
      saveFolioStrokes();
      redrawInk();
    }
  }
  function redoStroke() {
    const k = getFolioKey();
    if (currentRedo.length > 0) {
      if (!pageStrokes[k]) pageStrokes[k] = [];
      pageStrokes[k].push(currentRedo.pop());
      saveFolioStrokes();
      redrawInk();
    }
  }

  /* ── 5. Gesture Engine & Pointer Flipping ── */
  let down = null;
  stage.addEventListener('pointerdown', e => {
    if (inkEnabled || readingMode === 'continuous') return;
    if (e.target.closest('button, input, a, select')) return;
    down = { x: e.clientX, y: e.clientY, t: Date.now() };
  });

  stage.addEventListener('pointerup', e => {
    if (!down || inkEnabled || readingMode === 'continuous') return;
    const dx = e.clientX - down.x;
    const dy = e.clientY - down.y;
    down = null;

    if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 50) return;

    if (dx < -48) {
      jump(curIndex + 1, 'forward');
    } else if (dx > 48) {
      jump(curIndex - 1, 'backward');
    } else if (Math.abs(dx) < 10) {
      // Tap navigation: right 15% turns forward, left 15% turns backward
      const rect = stage.getBoundingClientRect();
      const relX = e.clientX - rect.left;
      if (relX > rect.width * 0.85) jump(curIndex + 1, 'forward');
      else if (relX < rect.width * 0.15) jump(curIndex - 1, 'backward');
    }
  });

  /* ── 6. UI Controls Binding ── */
  $('tocToggleBtn').onclick = openToc;
  $('btnTocClose').onclick = closeToc;
  $('tocBackdrop').onclick = closeToc;
  $('tocSearch').oninput = e => filterToc(e.target.value);

  // Pen Toggle
  $('btnPen').onclick = () => {
    inkEnabled = !inkEnabled;
    $('btnPen').classList.toggle('active', inkEnabled);
    penPalette.classList.toggle('hide', !inkEnabled);
    inkCanvas.classList.toggle('is-drawing', inkEnabled);
  };

  // Color Swatches
  penPalette.querySelectorAll('.ink-color-btn').forEach(btn => {
    btn.onclick = () => {
      penPalette.querySelectorAll('.ink-color-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentInkColor = btn.dataset.color;
      eraserActive = false;
      $('inkEraserBtn').classList.remove('active');
    };
  });

  $('inkEraserBtn').onclick = () => {
    eraserActive = !eraserActive;
    $('inkEraserBtn').classList.toggle('active', eraserActive);
  };
  $('inkUndoBtn').onclick = undoStroke;
  $('inkRedoBtn').onclick = redoStroke;
  $('clearInkBtn').onclick = () => {
    const k = getFolioKey();
    if (pageStrokes[k]?.length && confirm('Clear handwriting on this folio?')) {
      pageStrokes[k] = [];
      saveFolioStrokes();
      redrawInk();
    }
  };

  // Pan Toggle
  $('btnPan').onclick = () => {
    isPanMode = !isPanMode;
    $('btnPan').classList.toggle('active', isPanMode);
    stage.classList.toggle('pan-mode', isPanMode);
  };

  // Layout Mode Toggle
  $('btnMode').onclick = () => {
    if (readingMode === 'paginated') {
      readingMode = 'continuous';
      document.body.classList.add('mode-continuous');
      $('btnMode').title = 'Switch to 3D Paginated Mode (M)';
      chassis.innerHTML = folios.map((f, i) => `
        <article class="page-sheet" data-folio-index="${i}">
          ${renderFolioContent(f, i)}
        </article>
      `).join('');
    } else {
      readingMode = 'paginated';
      document.body.classList.remove('mode-continuous');
      $('btnMode').title = 'Switch to Continuous Mode (M)';
      chassis.innerHTML = `
        <article class="page-sheet rest" id="activeBookPage">
          <div class="gutter-crease"></div>
          <div id="folioContentSlot" style="height:100%;display:flex;flex-direction:column"></div>
          <canvas id="pageInkCanvas"></canvas>
        </article>
      `;
      // Re-query newly mounted elements
      window.location.reload();
    }
  };

  // Theme Cycler
  $('btnTheme').onclick = () => {
    document.body.classList.remove(themes[currentThemeIdx]);
    currentThemeIdx = (currentThemeIdx + 1) % themes.length;
    document.body.classList.add(themes[currentThemeIdx]);
  };

  // Zen Fullscreen
  $('btnZen').onclick = () => {
    document.body.classList.add('zen-mode');
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
  };
  $('btnExitZen').onclick = () => {
    document.body.classList.remove('zen-mode');
    if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
  };

  // Download Book
  $('btnDownload').onclick = () => {
    const blob = new Blob([rawBookHtml || document.documentElement.outerHTML], { type: 'text/html;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (titleEl.textContent.trim().replace(/\s+/g, '-') || 'HtmlArts-Book') + '.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };

  // Close Reader (Notifies Parent Server)
  $('btnClose').onclick = () => {
    if (isEmbedded) {
      window.parent.postMessage({ type: 'HTMLARTS_EVENT', payload: { event: 'close' } }, '*');
    } else {
      alert('You are viewing this book standalone.');
    }
  };

  // Steppers
  $('btnFirstPage').onclick = () => jump(0, 'backward');
  $('btnLastPage').onclick = () => jump(folios.length - 1, 'forward');
  $('timelineRange').oninput = e => jump(parseInt(e.target.value, 10), parseInt(e.target.value, 10) > curIndex ? 'forward' : 'backward');

  // Keyboard Shortcuts
  window.addEventListener('keydown', e => {
    if (['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
    if (e.key === 'Escape') {
      if ($('tocDrawer').classList.contains('open')) closeToc();
      else if (inkEnabled) $('btnPen').click();
      else if (document.body.classList.contains('zen-mode')) $('btnExitZen').click();
      else $('btnClose').click();
    }
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); jump(curIndex + 1, 'forward'); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); jump(curIndex - 1, 'backward'); }
    if (e.key === 'Home') { e.preventDefault(); jump(0, 'backward'); }
    if (e.key === 'End') { e.preventDefault(); jump(folios.length - 1, 'forward'); }
    if (e.key === 'i' || e.key === 'I') { e.preventDefault(); $('tocToggleBtn').click(); }
    if (e.key === 'p' || e.key === 'P') { e.preventDefault(); $('btnPen').click(); }
    if (e.key === 't' || e.key === 'T') { e.preventDefault(); $('btnTheme').click(); }
    if (e.key === 'm' || e.key === 'M') { e.preventDefault(); $('btnMode').click(); }
    if (e.key === 'f' || e.key === 'F') { e.preventDefault(); $('btnZen').click(); }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
      e.preventDefault();
      if (e.shiftKey) redoStroke(); else undoStroke();
    }
  });

  window.addEventListener('resize', () => { requestAnimationFrame(resizeInkCanvas); });

  /* ── 7. Bidirectional PostMessage Bridge with Server ── */
  window.addEventListener('message', e => {
    const d = e.data;
    if (!d || !d.type) return;

    if (d.type === 'HTMLARTS_LOAD') {
      const p = d.payload || {};
      bookId = p.bookId || 'book-01';
      extractFolios(p.html || '', p.metadata || {});
      if (isEmbedded) {
        window.parent.postMessage({ type: 'HTMLARTS_EVENT', payload: { event: 'book-ready', bookId } }, '*');
      }
    }
    if (d.type === 'HTMLARTS_NAV') {
      if (d.page === 'next') jump(curIndex + 1, 'forward');
      else if (d.page === 'prev') jump(curIndex - 1, 'backward');
      else if (typeof d.page === 'number') jump(d.page);
    }
  });

  // Standalone File Dropzone
  function initStandaloneFallback() {
    if (isEmbedded) return;
    $('dropFallback').classList.add('open');
    const box = $('dropzoneBox');
    const input = $('fileInputFallback');
    box.onclick = () => input.click();
    input.onchange = async () => {
      if (input.files.length) {
        const text = await input.files[0].text();
        $('dropFallback').classList.remove('open');
        extractFolios(text, { title: input.files[0].name.replace(/\.html?$/i, '') });
      }
    };
  }
  initStandaloneFallback();

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }
})();
</script>
</body>
</html>
