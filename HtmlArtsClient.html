<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HtmlArts · Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbf8f1;--ink:#33271f;--brown:#795234;--line:#e6dccb;--muted:#817568;--ui:'Manrope',sans-serif;--heading:'Playfair Display',Georgia,serif;--hand:'Kalam',cursive;--radius:8px;--toolbar-h:44px;--status-h:28px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--ui)}
/* ── Toolbar ── */
#toolbar{display:flex;align-items:center;height:var(--toolbar-h);padding:0 10px;gap:6px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fdfaf4,#f5efe4);user-select:none}
#bookTitle{flex:1;font-family:var(--heading);font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.tbtn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);color:var(--ink);cursor:pointer;font-size:15px;transition:background .15s,border-color .15s}
.tbtn:hover{background:#efe8db;border-color:var(--brown)}
.tbtn.active{background:var(--brown);color:#fff;border-color:var(--brown)}
.tbtn:disabled{opacity:.35;cursor:default;pointer-events:none}
.tbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sep{width:1px;height:22px;background:var(--line);margin:0 2px}
/* ── Stage ── */
#stage{position:relative;flex:1;overflow:hidden;background:var(--paper)}
#bookFrame{position:absolute;inset:0;width:100%;height:100%;border:none;background:#fff}
#inkCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;z-index:2;display:none}
#inkCanvas.active{display:block}
/* ── Status bar ── */
#status{display:flex;align-items:center;height:var(--status-h);padding:0 12px;border-top:1px solid var(--line);background:#f5efe4;font-size:11px;color:var(--muted);font-family:var(--hand);gap:8px}
#status .dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
#status .dot.pen{background:var(--brown)}
#status .dot.modified{background:#c0392b}
/* ── Layout ── */
#app{display:flex;flex-direction:column;height:100%}
/* ── Standalone fallback ── */
#fallback{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;text-align:center;padding:24px}
#fallback.visible{display:flex}
#app.hidden{display:none}
#dropzone{width:min(400px,90vw);padding:48px 24px;border:2.5px dashed var(--line);border-radius:16px;background:linear-gradient(135deg,#fdfaf4 0%,#f3ece0 100%);cursor:pointer;transition:border-color .2s,background .2s}
#dropzone:hover,#dropzone.dragover{border-color:var(--brown);background:#f0e7d7}
#dropzone h2{font-family:var(--heading);font-size:22px;color:var(--ink);margin-bottom:6px}
#dropzone p{font-family:var(--hand);font-size:14px;color:var(--muted)}
#dropzone .icon{font-size:36px;margin-bottom:8px;opacity:.6}
#fallbackTitle{font-family:var(--heading);font-size:28px;color:var(--brown);letter-spacing:.5px}
#fallbackSub{font-family:var(--hand);font-size:14px;color:var(--muted)}
#fileInput{display:none}
</style>
</head>
<body>

<!-- ── Standalone Fallback ── -->
<div id="fallback">
  <div id="fallbackTitle">✦ HtmlArts</div>
  <div id="fallbackSub">Open a book to start reading & annotating</div>
  <div id="dropzone" tabindex="0" role="button" aria-label="Drop an HTML file here or click to open">
    <div class="icon">📖</div>
    <h2>Drop an .html file here</h2>
    <p>or click to browse</p>
  </div>
  <input type="file" id="fileInput" accept=".html,.htm">
</div>

<!-- ── Reader App ── -->
<div id="app" class="hidden">
  <div id="toolbar">
    <span id="bookTitle">Untitled</span>
    <button class="tbtn" id="btnPen" title="Pen (P)"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
    <button class="tbtn" id="btnEraser" title="Eraser (E)"><svg viewBox="0 0 24 24"><path d="m7 21 3-3"/><path d="M18.4 3.6a2.1 2.1 0 0 1 3 3l-10 10-6.4 1.2 1.2-6.4z"/><rect x="2" y="19" width="20" height="2" rx="1" fill="currentColor" stroke="none" opacity=".18"/></svg></button>
    <div class="sep"></div>
    <button class="tbtn" id="btnUndo" title="Undo (Ctrl+Z)" disabled><svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button>
    <button class="tbtn" id="btnClear" title="Clear all" disabled><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
    <div class="sep"></div>
    <button class="tbtn" id="btnClose" title="Close"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>
  <div id="stage">
    <iframe id="bookFrame" sandbox="allow-same-origin" title="Book content"></iframe>
    <canvas id="inkCanvas"></canvas>
  </div>
  <div id="status">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Ready</span>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const isEmbedded = window.parent !== window;
const S = {
  bookId: null,
  readOnly: false,
  tool: null, strokes: [], redo: [], drawing: false,
  current: [], modified: false,
  zoom: 1, panX: 0, panY: 0, pinchDist0: 0, zoom0: 1,
};
const toolbar = $('toolbar'), title = $('bookTitle'), stage = $('stage');
const frame = $('bookFrame'), canvas = $('inkCanvas'), ctx = canvas.getContext('2d');
const btnPen = $('btnPen'), btnEraser = $('btnEraser');
const btnUndo = $('btnUndo'), btnClear = $('btnClear'), btnClose = $('btnClose');
const statusDot = $('statusDot'), statusTxt = $('statusText');

function sizeCanvas() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const w = stage.clientWidth, h = stage.clientHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
}

function toNorm(x, y) {
  const w = stage.clientWidth, h = stage.clientHeight;
  return [x / w, y / h];
}
function fromNorm(nx, ny) {
  return [nx * stage.clientWidth, ny * stage.clientHeight];
}

function drawStroke(stroke) {
  if (!stroke.pts || stroke.pts.length < 2) return;
  ctx.save();
  if (stroke.eraser) {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = 22;
  } else {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = '#211a14';
    ctx.lineWidth = 2.8;
  }
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  const [sx, sy] = fromNorm(stroke.pts[0][0], stroke.pts[0][1]);
  ctx.moveTo(sx, sy);
  for (let i = 1; i < stroke.pts.length; i++) {
    const [px, py] = fromNorm(stroke.pts[i][0], stroke.pts[i][1]);
    ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.restore();
}

function redraw() {
  ctx.clearRect(0, 0, stage.clientWidth, stage.clientHeight);
  for (const s of S.strokes) drawStroke(s);
}

function updateStatus() {
  const parts = [];
  if (S.tool === 'pen') { parts.push('Pen'); statusDot.className = 'dot pen'; }
  else if (S.tool === 'eraser') { parts.push('Eraser'); statusDot.className = 'dot pen'; }
  else { statusDot.className = 'dot'; }
  parts.push(`${S.strokes.length} stroke${S.strokes.length !== 1 ? 's' : ''}`);
  if (S.modified) { parts.push('modified'); statusDot.className = 'dot modified'; }
  if (S.readOnly) parts.push('read-only');
  statusTxt.textContent = parts.join(' · ');
}

function updateButtons() {
  btnPen.classList.toggle('active', S.tool === 'pen');
  btnEraser.classList.toggle('active', S.tool === 'eraser');
  canvas.classList.toggle('active', S.tool != null && !S.readOnly);
  canvas.style.cursor = S.tool === 'eraser' ? 'cell' : 'crosshair';
  btnUndo.disabled = S.strokes.length === 0;
  btnClear.disabled = S.strokes.length === 0;
  if (S.readOnly) {
    btnPen.disabled = btnEraser.disabled = btnClear.disabled = true;
    canvas.classList.remove('active');
  } else {
    btnPen.disabled = btnEraser.disabled = false;
  }
  updateStatus();
}

function selectTool(tool) {
  S.tool = S.tool === tool ? null : tool;
  updateButtons();
}

function emit(event, data) {
  const msg = { type: 'HTMLARTS_EVENT', payload: { event, bookId: S.bookId, ...( data ? { data } : {}) } };
  if (isEmbedded) window.parent.postMessage(msg, '*');
}

function emitAnnotations() {
  S.modified = true;
  emit('annotations-updated', { strokes: S.strokes });
  updateStatus();
}

function doUndo() {
  if (S.strokes.length === 0) return;
  S.redo.push(S.strokes.pop());
  redraw();
  emitAnnotations();
  updateButtons();
}

function doClear() {
  if (S.strokes.length === 0) return;
  if (!confirm('Clear all annotations?')) return;
  S.redo = [];
  S.strokes = [];
  redraw();
  emitAnnotations();
  updateButtons();
}

function doClose() {
  emit('close');
}

function ptrPos(e) {
  const r = canvas.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}

canvas.addEventListener('pointerdown', e => {
  if (S.readOnly || !S.tool) return;
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  S.drawing = true;
  S.redo = [];
  const [x, y] = ptrPos(e);
  S.current = [toNorm(x, y)];
});

canvas.addEventListener('pointermove', e => {
  if (!S.drawing) return;
  e.preventDefault();
  const [x, y] = ptrPos(e);
  S.current.push(toNorm(x, y));
  // incremental draw
  const stroke = { pts: S.current, eraser: S.tool === 'eraser' };
  redraw();
  drawStroke(stroke);
});

canvas.addEventListener('pointerup', e => {
  if (!S.drawing) return;
  S.drawing = false;
  if (S.current.length >= 2) {
    S.strokes.push({ pts: S.current, eraser: S.tool === 'eraser' });
    emitAnnotations();
  }
  S.current = [];
  redraw();
  updateButtons();
});

canvas.addEventListener('pointercancel', () => {
  S.drawing = false;
  S.current = [];
  redraw();
});

let touches = {};
stage.addEventListener('touchstart', e => {
  for (const t of e.changedTouches) touches[t.identifier] = { x: t.clientX, y: t.clientY };
  const ids = Object.keys(touches);
  if (ids.length === 2) {
    const [a, b] = ids.map(k => touches[k]);
    S.pinchDist0 = Math.hypot(a.x - b.x, a.y - b.y);
    S.zoom0 = S.zoom;
  }
}, { passive: true });

stage.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) touches[t.identifier] = { x: t.clientX, y: t.clientY };
  const ids = Object.keys(touches);
  if (ids.length === 2 && S.tool == null) {
    const [a, b] = ids.map(k => touches[k]);
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    S.zoom = Math.max(0.5, Math.min(5, S.zoom0 * (dist / S.pinchDist0)));
    applyTransform();
  }
}, { passive: true });

stage.addEventListener('touchend', e => {
  for (const t of e.changedTouches) delete touches[t.identifier];
});
stage.addEventListener('touchcancel', e => {
  for (const t of e.changedTouches) delete touches[t.identifier];
});

function applyTransform() {
  frame.style.transform = `scale(${S.zoom}) translate(${S.panX}px, ${S.panY}px)`;
  frame.style.transformOrigin = 'center center';
}

btnPen.addEventListener('click', () => selectTool('pen'));
btnEraser.addEventListener('click', () => selectTool('eraser'));
btnUndo.addEventListener('click', doUndo);
btnClear.addEventListener('click', doClear);
btnClose.addEventListener('click', doClose);

document.addEventListener('keydown', e => {
  if (e.key === 'p' || e.key === 'P') { selectTool('pen'); return; }
  if (e.key === 'e' || e.key === 'E') { selectTool('eraser'); return; }
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); doUndo(); }
});

const ro = new ResizeObserver(() => sizeCanvas());
ro.observe(stage);

function loadBook(html, meta, annots) {
  $('app').classList.remove('hidden');
  $('fallback').classList.remove('visible');
  frame.srcdoc = html;
  title.textContent = (meta && meta.title) || 'Untitled';
  if (annots && annots.strokes) S.strokes = annots.strokes;
  else S.strokes = [];
  S.redo = [];
  S.modified = false;
  S.zoom = 1; S.panX = 0; S.panY = 0;
  applyTransform();
  frame.onload = () => {
    sizeCanvas();
    updateButtons();
    emit('book-ready');
  };
}

window.addEventListener('message', e => {
  const d = e.data;
  if (!d || !d.type) return;
  if (d.type === 'HTMLARTS_LOAD') {
    const p = d.payload || {};
    S.bookId = p.bookId || null;
    S.readOnly = !!(p.config && p.config.readOnly);
    loadBook(p.html || '', p.metadata, p.annotations);
  }
  if (d.type === 'HTMLARTS_CONFIG') {
    const p = d.payload || {};
    if ('readOnly' in p) S.readOnly = !!p.readOnly;
    updateButtons();
  }
});

function initStandalone() {
  if (isEmbedded) return;          // wait for postMessage
  $('fallback').classList.add('visible');
  const dz = $('dropzone');
  const fi = $('fileInput');

  dz.addEventListener('click', () => fi.click());
  dz.addEventListener('keydown', e => { if (e.key === 'Enter') fi.click(); });

  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
  dz.addEventListener('drop', e => {
    e.preventDefault();
    dz.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file) readFile(file);
  });

  fi.addEventListener('change', () => { if (fi.files[0]) readFile(fi.files[0]); });

  function readFile(f) {
    const reader = new FileReader();
    reader.onload = () => {
      S.bookId = f.name;
      loadBook(reader.result, { title: f.name }, null);
    };
    reader.readAsText(f);
  }
}

initStandalone();
</script>
</body>
</html>
