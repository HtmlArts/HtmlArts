<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HtmlArts · Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Kalam:wght@300;400;700&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   01. HTMLARTS DESIGN SYSTEM & WARM EDITORIAL PALETTES
   ========================================================= */
:root {
  --header-h: 62px;
  --footer-h: 52px;
  --paper: #fbf8f1;
  --paper2: #f6f0e5;
  --ink: #33271f;
  --muted: #817568;
  --line: #e6dccb;
  --brown: #795234;
  --brown2: #916b49;
  --gold: #e8c98c;
  --sage: #89927a;
  --white: #fffdf8;
  --shadow: 0 16px 40px rgba(74, 53, 32, 0.08);
  --hand: 'Kalam', cursive;
  --serif: 'Playfair Display', Georgia, serif;
  --sans: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: 'DM Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
  font-family: var(--sans);
  user-select: none;
  -webkit-user-select: none;
}

/* 4 Reading Themes Harmonized with HtmlArts */
body.theme-cream {
  --desk-bg: var(--paper);
  --paper-bg: var(--white);
  --paper-text: var(--ink);
  --paper-border: var(--line);
  --paper-sub: var(--muted);
  --paper-card: var(--paper2);
  --paper-accent: var(--brown);
  --spine-shadow: rgba(74, 53, 32, 0.16);
  --book-edge: #d5cbbb;
  --bar-bg: rgba(251, 248, 241, 0.96);
  --bar-text: var(--ink);
  --bar-border: var(--line);
}
body.theme-sage {
  --desk-bg: #f3f5f0;
  --paper-bg: #fafbf8;
  --paper-text: #283325;
  --paper-border: #d4ded0;
  --paper-sub: #637560;
  --paper-card: #e7ece3;
  --paper-accent: #4a6741;
  --spine-shadow: rgba(40, 51, 37, 0.14);
  --book-edge: #ccd7c8;
  --bar-bg: rgba(243, 245, 240, 0.96);
  --bar-text: #283325;
  --bar-border: #d4ded0;
}
body.theme-white {
  --desk-bg: #f5f5f7;
  --paper-bg: #ffffff;
  --paper-text: #1d1d1f;
  --paper-border: #e0e0e3;
  --paper-sub: #6e6e73;
  --paper-card: #f0f0f2;
  --paper-accent: #0066cc;
  --spine-shadow: rgba(0, 0, 0, 0.08);
  --book-edge: #d2d2d7;
  --bar-bg: rgba(255, 255, 255, 0.96);
  --bar-text: #1d1d1f;
  --bar-border: #e0e0e3;
}
body.theme-velvet {
  --desk-bg: #1a1512;
  --paper-bg: #241e1a;
  --paper-text: #f5ede6;
  --paper-border: #3d322b;
  --paper-sub: #a89a8f;
  --paper-card: #2f2722;
  --paper-accent: #e8a87c;
  --spine-shadow: rgba(0, 0, 0, 0.5);
  --book-edge: #332a24;
  --bar-bg: rgba(26, 21, 18, 0.96);
  --bar-text: #f5ede6;
  --bar-border: #3d322b;
}

body {
  background-color: var(--desk-bg);
  color: var(--paper-text);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background-image: radial-gradient(rgba(116, 87, 57, 0.08) 0.7px, transparent 0.7px);
  background-size: 18px 18px;
  transition: background-color 0.25s ease, color 0.25s ease;
}

/* =========================================================
   02. MASTER READER HEADER (WARM & MINIMALIST)
   ========================================================= */
#siteHeader {
  height: var(--header-h);
  width: 100%;
  background: var(--bar-bg);
  color: var(--bar-text);
  border-bottom: 1px solid var(--bar-border);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  padding: 0 max(16px, calc((100vw - 1240px)/2));
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 50;
  flex-shrink: 0;
}

.header-left, .header-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Sleek Back Icon Button */
.btn-back-circle {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--paper-bg);
  color: var(--brown);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all .18s ease;
  box-shadow: 0 1px 3px rgba(74, 53, 32, 0.04);
}
.btn-back-circle:hover {
  background: #f0e4ce;
  border-color: var(--brown2);
  transform: translateX(-2px);
}
.btn-back-circle:active {
  transform: scale(0.94);
}

.header-sep {
  color: #c9bea9;
  font: 300 15px var(--sans);
  margin: 0 4px;
  user-select: none;
}

.header-brand-title {
  font: 800 15px var(--sans);
  color: var(--brown);
  letter-spacing: -.02em;
  display: inline-flex;
  align-items: center;
}

#bookTitle {
  font: 600 16px var(--serif);
  color: var(--ink);
  letter-spacing: -.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: clamp(140px, 35vw, 420px);
}

/* Book-Level Aligned Navigation Bar */
.book-viewport-wrap {
  position: relative;
  max-width: 1040px;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: center;
  gap: 10px;
}

.book-level-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 2px;
  flex-shrink: 0;
  height: 28px;
}

.btn-book-index {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 14px;
  border-radius: 16px;
  background: var(--paper-bg);
  border: 1px solid var(--line);
  color: var(--brown);
  font: 800 11px var(--sans);
  cursor: pointer;
  letter-spacing: .02em;
  transition: all .18s ease;
  box-shadow: 0 1px 3px rgba(74, 53, 32, 0.05);
}
.btn-book-index:hover {
  background: #ede3d2;
  border-color: var(--brown2);
  transform: translateY(-1px);
}
.btn-book-index:active {
  transform: scale(0.96);
}
.btn-book-index svg {
  width: 14px;
  height: 14px;
}

.book-level-folio-badge {
  font: 700 10px var(--mono);
  padding: 3px 9px;
  border-radius: 12px;
  background: var(--paper-bg);
  border: 1px solid var(--line);
  color: var(--muted);
  letter-spacing: .06em;
  text-transform: uppercase;
}

.folio-inline-index-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 12px;
  background: var(--paper-card);
  border: 1px solid var(--paper-border);
  color: var(--paper-accent);
  font: 700 11px var(--sans);
  cursor: pointer;
  transition: all .15s ease;
}
.folio-inline-index-btn:hover {
  background: var(--paper-border);
  color: var(--ink);
}

.header-icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: #fffdf9;
  color: #6f6255;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all .18s ease;
}
.header-icon-btn:hover {
  background: #f0e4ce;
  color: var(--brown);
  border-color: var(--brown2);
  transform: translateY(-1px);
}
.header-icon-btn.active {
  background: var(--brown);
  color: #fffdf8;
  border-color: var(--brown);
  box-shadow: 0 2px 8px rgba(121, 82, 52, 0.25);
}
.header-icon-btn svg {
  width: 18px;
  height: 18px;
}

/* =========================================================
   03. AUTHENTIC PEN PANEL (COPIED DIRECTLY FROM MAIN PAGE)
   ========================================================= */
.footer-pen-station {
  position: fixed;
  bottom: 64px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 55;
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 8px 18px;
  background: rgba(255, 253, 248, 0.98);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1.5px solid var(--line);
  border-radius: 26px;
  box-shadow: 0 16px 40px rgba(58, 42, 26, 0.16);
  user-select: none;
  width: min(880px, calc(100vw - 32px));
  max-width: 95vw;
  animation: drop .2s ease-out;
}
.footer-pen-station.active {
  display: flex;
}
@keyframes drop {
  from { opacity: 0; transform: translate(-50%, 8px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

.folio-zone-left {
  display: flex;
  align-items: center;
  gap: 6px;
}
.folio-label {
  font: 600 12px var(--hand);
  color: var(--brown);
  margin-right: 4px;
}
.folio-badge-pill {
  font: 700 11px var(--mono);
  background: var(--paper2);
  color: var(--brown);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 3px 10px;
}

.pen-zone-center {
  display: flex;
  align-items: center;
}
.master-nib-btn {
  border: 1px solid #d7c7ae;
  background: var(--brown);
  color: #fffdf8;
  border-radius: 20px;
  padding: 7px 15px;
  font: 800 12px var(--sans);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 2px 6px rgba(121, 82, 52, 0.2);
  transition: all .18s ease;
}
.master-nib-btn:hover {
  background: #634329;
  transform: translateY(-1px);
}
.master-nib-btn.resting {
  background: #fffdf9;
  color: var(--brown);
  border-color: var(--line);
  box-shadow: none;
}

.tools-zone-right {
  display: flex;
  align-items: center;
  gap: 8px;
}
.inkwell-palette {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 8px;
  border-left: 1px solid var(--line);
  border-right: 1px solid var(--line);
}
.ink-drop {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 2px solid #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,0.22);
  cursor: pointer;
  transition: transform .15s ease;
}
.ink-drop:hover {
  transform: scale(1.22);
}
.ink-drop.active {
  transform: scale(1.3);
  box-shadow: 0 0 0 2.5px var(--brown);
}

.tool-btn {
  border: 1px solid var(--line);
  background: #fffdf9;
  color: var(--brown);
  border-radius: 18px;
  padding: 6px 12px;
  font: 800 11px var(--sans);
  cursor: pointer;
  transition: background .15s, border-color .15s;
}
.tool-btn:hover {
  background: #f0e4ce;
  border-color: var(--brown2);
}
.tool-btn.primary {
  background: var(--brown);
  color: #fffdf8;
  border-color: var(--brown);
}
.tool-btn.primary:hover {
  background: #634329;
}

/* =========================================================
   04. 3D BOOK STAGE & CASING (WARM PARCHMENT AESTHETIC)
   ========================================================= */
#bookStage {
  flex: 1;
  width: 100%;
  height: calc(100vh - var(--header-h) - var(--footer-h));
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: clamp(10px, 2.5vw, 34px);
  perspective: 2200px;
  overflow: hidden;
  touch-action: pan-y;
}

#bookStage.pan-mode { cursor: grab; }
#bookStage.pan-mode:active { cursor: grabbing; }

.book-chassis {
  position: relative;
  width: 100%;
  flex: 1;
  min-height: 0;
  border-radius: 6px 16px 16px 6px;
  box-shadow: 0 32px 80px rgba(74, 53, 32, 0.16), 0 4px 18px rgba(74, 53, 32, 0.08);
  transform-style: preserve-3d;
  display: flex;
  align-items: center;
  justify-content: center;
}
.book-chassis::before {
  content: ''; position: absolute; top: 6px; bottom: 6px; left: -14px; width: 14px;
  background: linear-gradient(to right, #4a3424 0%, #795234 50%, #593c26 100%);
  border-radius: 4px 0 0 4px; box-shadow: inset 2px 0 4px rgba(0,0,0,0.4); z-index: 1;
}
.book-chassis::after {
  content: ''; position: absolute; right: -10px; top: 8px; bottom: 8px; width: 10px;
  background: repeating-linear-gradient(to bottom, var(--book-edge), var(--book-edge) 2px, rgba(121,82,52,0.18) 3px);
  border-radius: 0 4px 4px 0; box-shadow: 2px 0 5px rgba(0,0,0,0.15); z-index: 1;
}

.page-sheet {
  position: relative;
  width: 100%;
  height: 100%;
  background-color: var(--paper-bg);
  color: var(--paper-text);
  border: 1px solid var(--paper-border);
  border-radius: 4px 16px 16px 4px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
  box-shadow: var(--shadow);
  transform-origin: left center;
  transform-style: preserve-3d;
  backface-visibility: hidden;
  will-change: transform, opacity;
  transition: transform 0.55s cubic-bezier(0.22, 0.78, 0.18, 1), opacity 0.55s ease;
}
.page-sheet.turn-left {
  transform: rotateY(-105deg) scale(0.97);
  opacity: 0;
}
.page-sheet.turn-right {
  transform-origin: right center;
  transform: rotateY(105deg) scale(0.97);
  opacity: 0;
}
.page-sheet.rest {
  transform: rotateY(0deg) scale(1);
  opacity: 1;
}

.gutter-crease {
  position: absolute; left: 0; top: 0; bottom: 0; width: 26px;
  background: linear-gradient(to right, var(--spine-shadow) 0%, transparent 100%);
  pointer-events: none; z-index: 20; opacity: 0.65;
}

/* Authentic Editorial Header & Footer in Folios */
.folio-header-strip {
  padding: 16px 32px 12px;
  border-bottom: 1px solid var(--paper-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.folio-header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.folio-header-icon {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--paper-card);
  color: var(--paper-accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font: 700 12px var(--mono);
}
.folio-header-cat {
  font: 700 9px var(--mono);
  text-transform: uppercase;
  letter-spacing: .14em;
  color: var(--paper-accent);
}
.folio-header-title {
  font: 700 17px var(--serif);
  line-height: 1.15;
  color: var(--paper-text);
}
.folio-header-count {
  font: 700 12px var(--mono);
  color: var(--paper-sub);
}

.folio-body {
  padding: 24px 34px;
  flex: 1;
  overflow-y: auto;
  font-family: var(--serif);
  line-height: 1.8;
}
.folio-body::-webkit-scrollbar { width: 5px; }
.folio-body::-webkit-scrollbar-thumb { background: rgba(121, 82, 52, 0.2); border-radius: 4px; }

.folio-footer-strip {
  padding: 11px 32px;
  border-top: 1px solid var(--paper-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font: 11px var(--hand);
  color: var(--paper-sub);
  flex-shrink: 0;
}

/* Vector Handwriting Canvas Overlay */
#pageInkCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 25;
  pointer-events: none;
  touch-action: none;
}
#pageInkCanvas.pen-active {
  pointer-events: auto;
  cursor: crosshair;
}

/* Continuous Scroll Mode */
body.mode-continuous #bookStage {
  overflow-y: auto !important;
  display: block !important;
}
body.mode-continuous .book-chassis {
  max-width: 920px;
  margin: 0 auto;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
body.mode-continuous .book-chassis::before,
body.mode-continuous .book-chassis::after { display: none; }
body.mode-continuous .page-sheet {
  transform: none !important;
  opacity: 1 !important;
  min-height: 75vh;
  margin-bottom: 24px;
}

/* =========================================================
   05. BOTTOM TIMELINE SCRUBBER
   ========================================================= */
#siteFooter {
  height: var(--footer-h);
  width: 100%;
  background: var(--bar-bg);
  color: var(--bar-text);
  border-top: 1px solid var(--bar-border);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  padding: 0 max(18px, calc((100vw - 1240px)/2));
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  z-index: 50;
  flex-shrink: 0;
}

.footer-left {
  display: flex;
  align-items: center;
  gap: 6px;
  font: 700 12px var(--mono);
  min-width: 85px;
}
#readPercentage { color: var(--brown); }

.footer-center {
  flex: 1;
  max-width: 560px;
  margin: 0 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.stepper-btn {
  background: transparent;
  border: none;
  color: var(--bar-text);
  opacity: 0.7;
  cursor: pointer;
  display: grid;
  place-items: center;
  padding: 4px;
  transition: opacity .15s, transform .15s;
}
.stepper-btn:hover { opacity: 1; transform: scale(1.1); color: var(--brown); }
.stepper-btn svg { width: 16px; height: 16px; }

#timelineRange {
  width: 100%;
  height: 5px;
  border-radius: 6px;
  background: var(--line);
  outline: none;
  cursor: pointer;
  accent-color: var(--brown);
}

.footer-right {
  display: flex;
  align-items: center;
  gap: 9px;
  font: 700 11px var(--mono);
}
#nodeCategoryBadge {
  padding: 3px 9px;
  border-radius: 12px;
  background: var(--paper2);
  color: var(--brown);
  border: 1px solid var(--line);
  text-transform: uppercase;
  letter-spacing: .08em;
}

/* =========================================================
   06. TABLE OF CONTENTS DRAWER
   ========================================================= */
#tocDrawer {
  position: fixed;
  inset-y: 0;
  left: 0;
  width: min(380px, 86vw);
  background: var(--white);
  color: var(--ink);
  border-right: 1.5px solid var(--line);
  box-shadow: 20px 0 60px rgba(74, 53, 32, 0.18);
  transform: translateX(-100%);
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  z-index: 80;
  display: flex;
  flex-direction: column;
}
#tocDrawer.open { transform: translateX(0); }

.toc-header {
  padding: 18px 22px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--paper);
}
.toc-header h3 {
  font: 700 17px var(--serif);
  color: var(--brown);
  letter-spacing: -.02em;
}
.toc-close-btn {
  background: transparent;
  border: none;
  color: var(--muted);
  cursor: pointer;
  padding: 4px;
}
.toc-close-btn:hover { color: var(--ink); }
.toc-close-btn svg { width: 19px; height: 19px; }

.toc-search-wrap {
  padding: 12px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--paper2);
}
#tocSearch {
  width: 100%;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 12px;
  color: var(--ink);
  font: 12px var(--sans);
  outline: none;
}
#tocSearch:focus { border-color: var(--brown); }

#tocList {
  flex: 1;
  overflow-y: auto;
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.toc-item {
  padding: 10px 14px;
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  color: var(--ink);
  transition: background .15s, color .15s;
}
.toc-item:hover {
  background: var(--paper2);
  color: var(--brown);
}
.toc-item.active {
  background: #f0e4ce;
  color: var(--brown);
  font-weight: 700;
}
.toc-item-left {
  display: flex;
  align-items: center;
  gap: 10px;
  overflow: hidden;
}
.toc-num {
  font: 700 11px var(--mono);
  color: var(--brown2);
  min-width: 22px;
}
.toc-name {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.toc-tag {
  font: 700 9px var(--mono);
  padding: 2px 7px;
  border-radius: 4px;
  background: var(--paper);
  border: 1px solid var(--line);
  color: var(--muted);
  text-transform: uppercase;
}

#tocBackdrop {
  position: fixed;
  inset: 0;
  background: rgba(48, 32, 18, 0.45);
  backdrop-filter: blur(4px);
  z-index: 75;
  display: none;
}
#tocBackdrop.open { display: block; }

/* Zen Viewport Mode */
body.zen-mode #siteHeader,
body.zen-mode #siteFooter,
body.zen-mode #footerPenStation { display: none !important; }
body.zen-mode #bookStage { height: 100dvh !important; padding: 0 !important; }
body.zen-mode .book-chassis { max-width: 100vw !important; height: 100% !important; border-radius: 0 !important; }
body.zen-mode .page-sheet { border-radius: 0 !important; border: none !important; }
#btnExitZen {
  display: none;
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 90;
  padding: 8px 16px;
  border-radius: 20px;
  background: #fffaf1;
  color: var(--brown);
  border: 1px solid #d7c7ae;
  font: 800 11px var(--sans);
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(74, 53, 32, 0.15);
}
body.zen-mode #btnExitZen { display: flex; align-items: center; gap: 6px; }

/* Standalone Fallback Dropzone */
#dropFallback {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--desk-bg);
  z-index: 100;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
}
#dropFallback.open { display: flex; }
.drop-box {
  width: min(420px, 92vw);
  padding: 48px 24px;
  border: 2px dashed #d7c7ae;
  border-radius: 22px;
  background: #fffaf1;
  cursor: pointer;
  box-shadow: var(--shadow);
}
.drop-box:hover { border-color: var(--brown); background: #fdfaf4; }
</style>
</head>
<body class="theme-cream">

  <!-- ======================================================== -->
  <!-- 1. MASTER UNIFIED HEADER (WARM BRAND HARMONY)            -->
  <!-- ======================================================== -->
  <header id="siteHeader">
    <div class="header-left">
      <!-- Sleek Back Icon Button (Replaces "Catalog" text) -->
      <button class="btn-back-circle" id="btnBackToCatalog" title="Back to Library Catalog Shelf">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:18px;height:18px">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>

      <span class="header-sep">|</span>

      <!-- Brand and Book Title: <HtmlBook | Book name -->
      <span class="header-brand-title">&lt;HtmlBook</span>

      <span class="header-sep">|</span>

      <span id="bookTitle">Loading Book...</span>
    </div>

    <div class="header-right">
      <!-- Digital Pen Toggle (Opens Main Page Pen Station) -->
      <button class="header-icon-btn" id="btnPen" title="Toggle Handwriting Pen & Ink Station (P)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="m12 19 7-7 3 3-7 7-3-3z"/>
          <path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18"/>
          <path d="m2 2 7.586 7.586"/>
          <circle cx="11" cy="11" r="2"/>
        </svg>
      </button>

      <!-- Reading Layout Mode (3D Paginated vs Continuous Scroll) -->
      <button class="header-icon-btn" id="btnMode" title="Switch Reading Mode: 3D Paginated / Continuous (M)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
      </button>

      <!-- Theme Cycler (Warm Cream, Sage, Pure White, Dark Velvet) -->
      <button class="header-icon-btn" id="btnTheme" title="Cycle Reading Theme Tint (T)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/>
          <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/>
          <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/>
          <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/>
          <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.8-.7 1.8-1.5 0-.4-.2-.8-.4-1.1-.3-.4-.4-.8-.4-1.4 0-1.1.9-2 2-2h2.3c3.7 0 6.7-3 6.7-6.7C22 5.6 17.5 2 12 2z"/>
        </svg>
      </button>

      <!-- Zen Fullscreen -->
      <button class="header-icon-btn" id="btnZen" title="Zen Fullscreen View (F)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
        </svg>
      </button>

      <!-- Download Book -->
      <button class="header-icon-btn" id="btnDownload" title="Download Standalone Book HTML">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ======================================================== -->
  <!-- 2. AUTHENTIC PEN PANEL (COPIED DIRECTLY FROM MAIN PAGE)  -->
  <!-- ======================================================== -->
  <div class="footer-pen-station" id="footerPenStation">
    <!-- ZONE 1: LEFT - Folio Indicator -->
    <div class="folio-zone-left">
      <span class="folio-label">Folios:</span>
      <span class="folio-badge-pill" id="penFolioBadge">Folio 1</span>
    </div>

    <!-- ZONE 2: CENTER - Master Nib Button -->
    <div class="pen-zone-center">
      <button class="master-nib-btn" id="btnMasterNib" title="Toggle Writing Nib">
        <span style="font-size:15px">🖋️</span> <span id="masterNibLabel">Nib (Active)</span>
      </button>
    </div>

    <!-- ZONE 3: RIGHT - Middle Color Default (Terracotta Sienna), Undo/Redo & Download -->
    <div class="tools-zone-right">
      <div class="inkwell-palette" title="Archival Inkwell Palette">
        <div class="ink-drop" data-color="#261a12" title="Iron Gall Dark Sepia" style="background:#261a12"></div>
        <div class="ink-drop" data-color="#5a3d24" title="Walnut Husk Brown" style="background:#5a3d24"></div>
        <!-- Terracotta Sienna Selected By Default -->
        <div class="ink-drop active" data-color="#994d29" title="Terracotta Sienna (Default)" style="background:#994d29"></div>
        <div class="ink-drop" data-color="#4f6154" title="Sage Verdigris" style="background:#4f6154"></div>
        <div class="ink-drop" data-color="#2b3a4a" title="Dusk Indigo" style="background:#2b3a4a"></div>
      </div>

      <button class="tool-btn" id="btnUndoFolio" title="Undo stroke (Ctrl+Z)">↶ Undo</button>
      <button class="tool-btn" id="btnRedoFolio" title="Redo stroke (Ctrl+Y)">↷ Redo</button>
      <button class="tool-btn" id="btnClearFolio" title="Clear this folio">Clear</button>
      <button class="tool-btn primary" id="btnDownloadNotes" title="Download note as transparent image">↓ Export</button>
    </div>
  </div>

  <!-- ======================================================== -->
  <!-- 3. MAIN BOOK STAGE (3D PAGINATED & CONTINUOUS MODES)     -->
  <!-- ======================================================== -->
  <main id="bookStage">
    <div class="book-viewport-wrap">
      <!-- Book-Level Aligned Header Strip -->
      <div class="book-level-bar" id="bookLevelBar">
        <button class="btn-book-index" id="tocToggleBtn" title="Open Chapter Index (I)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="15" y2="12"/>
            <line x1="3" y1="18" x2="18" y2="18"/>
          </svg>
          <span>Index</span>
        </button>

        <div class="book-level-right">
          <span class="book-level-folio-badge" id="bookBadge">24 Folios</span>
        </div>
      </div>

      <div class="book-chassis" id="bookChassis">
        <article class="page-sheet rest" id="activeBookPage">
          <div class="gutter-crease"></div>
          <div id="folioContentSlot" style="height:100%;display:flex;flex-direction:column">
            <!-- Dynamic folio rendered here -->
          </div>
          <canvas id="pageInkCanvas"></canvas>
        </article>
      </div>
    </div>

    <!-- Floating Exit Zen Button -->
    <button id="btnExitZen">
      <span>✕ Exit Fullscreen</span>
    </button>
  </main>

  <!-- ======================================================== -->
  <!-- 4. BOTTOM TIMELINE SCRUBBER                              -->
  <!-- ======================================================== -->
  <footer id="siteFooter">
    <div class="footer-left">
      <span>Read:</span>
      <span id="readPercentage">0%</span>
    </div>

    <div class="footer-center">
      <button class="stepper-btn" id="btnFirstPage" title="First Cover">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/>
        </svg>
      </button>

      <input type="range" id="timelineRange" min="0" max="0" value="0" step="1">

      <button class="stepper-btn" id="btnLastPage" title="Last Folio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/>
        </svg>
      </button>
    </div>

    <div class="footer-right">
      <span id="nodeCategoryBadge">SPECIAL EDITION</span>
      <span id="folioCountDisplay">1 / 1</span>
    </div>
  </footer>

  <!-- ======================================================== -->
  <!-- 5. TABLE OF CONTENTS DRAWER                              -->
  <!-- ======================================================== -->
  <div id="tocBackdrop"></div>
  <aside id="tocDrawer" aria-label="Table of Contents">
    <div class="toc-header">
      <h3>Chapter Index</h3>
      <button class="toc-close-btn" id="btnTocClose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="toc-search-wrap">
      <input type="text" id="tocSearch" placeholder="Search chapters & topics...">
    </div>

    <div id="tocList">
      <!-- Populated dynamically from book folios -->
    </div>
  </aside>

  <!-- ======================================================== -->
  <!-- 6. STANDALONE FILE DROPZONE (FALLBACK)                   -->
  <!-- ======================================================== -->
  <div id="dropFallback">
    <div class="drop-box" id="dropzoneBox">
      <div style="font-size:38px;margin-bottom:12px">📖</div>
      <h2 style="font:700 22px var(--serif);color:var(--brown);margin-bottom:6px">HtmlArts Reader</h2>
      <p style="font:13px var(--hand);color:var(--muted)">Drop any .html book file here or click to browse</p>
    </div>
    <input type="file" id="fileInputFallback" accept=".html,.htm" style="display:none">
  </div>

<script>
(()=>{
  'use strict';
  const $ = id => document.getElementById(id);
  const isEmbedded = window.parent !== window;

  // State
  let bookId = 'book-01';
  let folios = [];
  let curIndex = 0;
  let isFlipping = false;
  let readingMode = 'paginated';
  let isPanMode = false;
  let rawBookHtml = '';

  const themes = ['theme-cream', 'theme-sage', 'theme-white', 'theme-velvet'];
  let currentThemeIdx = 0;

  // Authentic Pen State (Default: Terracotta Sienna)
  let penActive = false;
  let currentColor = '#994d29';
  let activeStroke = null;
  let pageStrokes = {};
  let currentRedo = [];

  const stage = $('bookStage');
  const chassis = $('bookChassis');
  const activePage = $('activeBookPage');
  const slot = $('folioContentSlot');
  const inkCanvas = $('pageInkCanvas');
  const inkCtx = inkCanvas.getContext('2d');
  const penStation = $('footerPenStation');
  const masterNibBtn = $('btnMasterNib');
  const masterNibLabel = $('masterNibLabel');
  const penFolioBadge = $('penFolioBadge');

  const titleEl = $('bookTitle');
  const badgeEl = $('bookBadge');
  const catBadge = $('nodeCategoryBadge');
  const countDisplay = $('folioCountDisplay');
  const pctDisplay = $('readPercentage');
  const rangeInput = $('timelineRange');

  /* ── 1. Book Parsing & Folio Extraction ── */
  function extractFolios(rawHtml, metadata = {}) {
    rawBookHtml = rawHtml;
    const parser = new DOMParser();
    const doc = parser.parseFromString(rawHtml, 'text/html');

    const title = metadata.title || doc.querySelector('title')?.textContent?.trim() || 'HtmlArts Publication';
    titleEl.textContent = title;

    const pageNodes = doc.querySelectorAll('article.page, section.page, .stage > article, .stage > section');
    const parsed = [];

    if (pageNodes.length > 0) {
      pageNodes.forEach((node, idx) => {
        const cat = node.dataset.category || node.querySelector('.meta span:first-child')?.textContent?.trim() || metadata.category || 'Chapter';
        const name = node.dataset.name || node.querySelector('h1, h2')?.textContent?.trim() || `Folio ${idx + 1}`;
        const isCover = node.classList.contains('cover') || idx === 0;
        parsed.push({
          id: node.id || `folio-${idx}`,
          title: name,
          category: cat,
          isCover,
          content: node.innerHTML
        });
      });
    } else {
      const headings = doc.querySelectorAll('h1, h2, h3, h4');
      if (headings.length > 0) {
        headings.forEach((h, idx) => {
          let body = '';
          let sib = h.nextElementSibling;
          let count = 0;
          while (sib && count < 4 && !['H1','H2','H3','H4'].includes(sib.tagName)) {
            body += sib.outerHTML;
            sib = sib.nextElementSibling;
            count++;
          }
          parsed.push({
            id: `folio-${idx}`,
            title: h.textContent.trim() || `Section ${idx + 1}`,
            category: metadata.category || 'Reading',
            isCover: idx === 0,
            content: `<h2>${h.textContent}</h2>${body}`
          });
        });
      } else {
        parsed.push({
          id: 'folio-0',
          title: title,
          category: metadata.category || 'Document',
          isCover: false,
          content: doc.body ? doc.body.innerHTML : rawHtml
        });
      }
    }

    folios = parsed;
    badgeEl.textContent = `${folios.length} FOLIOS`;
    rangeInput.max = Math.max(0, folios.length - 1);
    buildToc();
    jump(0, 'none');
  }

  /* ── 2. Table of Contents Builder ── */
  function buildToc() {
    const list = $('tocList');
    list.innerHTML = '';
    folios.forEach((f, idx) => {
      const item = document.createElement('div');
      item.className = 'toc-item' + (idx === curIndex ? ' active' : '');
      item.innerHTML = `
        <div class="toc-item-left">
          <span class="toc-num">${String(idx + 1).padStart(2, '0')}</span>
          <span class="toc-name">${escapeHtml(f.title)}</span>
        </div>
        <span class="toc-tag">${escapeHtml(f.category)}</span>
      `;
      item.onclick = () => {
        jump(idx, idx > curIndex ? 'forward' : 'backward');
        closeToc();
      };
      list.appendChild(item);
    });
  }

  function filterToc(term) {
    const items = $('tocList').querySelectorAll('.toc-item');
    items.forEach(it => {
      it.style.display = it.textContent.toLowerCase().includes(term.toLowerCase()) ? 'flex' : 'none';
    });
  }

  function openToc() {
    $('tocDrawer').classList.add('open');
    $('tocBackdrop').classList.add('open');
    $('tocSearch').focus();
  }
  function closeToc() {
    $('tocDrawer').classList.remove('open');
    $('tocBackdrop').classList.remove('open');
  }
  window.openToc = openToc;
  window.closeToc = closeToc;

  /* ── 3. Folio Renderer (Paginated 3D vs Continuous) ── */
  function renderFolioContent(folio, idx) {
    if (folio.isCover) {
      return `
        <div class="gutter-crease"></div>
        <div class="inner" style="height:100%;padding:clamp(24px,5vw,56px);display:flex;flex-direction:column;justify-content:space-between">
          ${folio.content}
        </div>
      `;
    }
    return `
      <div class="gutter-crease"></div>
      <div class="folio-header-strip">
        <div class="folio-header-left">
          <div class="folio-header-icon">${String(idx + 1).padStart(2, '0')}</div>
          <div>
            <div class="folio-header-cat">${escapeHtml(folio.category)}</div>
            <div class="folio-header-title">${escapeHtml(folio.title)}</div>
          </div>
        </div>
        <div class="folio-header-right" style="display:flex;align-items:center;gap:12px">
          <button class="folio-inline-index-btn" onclick="openToc()" title="Open Chapter Index (I)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px">
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="12" x2="15" y2="12"/>
              <line x1="3" y1="18" x2="18" y2="18"/>
            </svg>
            <span>Index</span>
          </button>
          <div class="folio-header-count">${String(idx + 1).padStart(2, '0')} / ${folios.length}</div>
        </div>
      </div>
      <div class="folio-body">
        ${folio.content}
      </div>
      <div class="folio-footer-strip">
        <span>HtmlArts • Spec Edition</span>
        <span>Swipe or Flip to turn →</span>
      </div>
    `;
  }

  function jump(index, dir = 'forward') {
    if (index < 0 || index >= folios.length || isFlipping) return;
    isFlipping = true;
    curIndex = index;

    if (readingMode === 'continuous') {
      const target = document.querySelector(`[data-folio-index="${curIndex}"]`);
      if (target) target.scrollIntoView({ behavior: 'smooth' });
      isFlipping = false;
      updateUI();
      return;
    }

    if (dir === 'forward') {
      activePage.classList.remove('rest', 'turn-right');
      activePage.classList.add('turn-left');
    } else if (dir === 'backward') {
      activePage.classList.remove('rest', 'turn-left');
      activePage.classList.add('turn-right');
    }

    setTimeout(() => {
      const f = folios[curIndex];
      slot.innerHTML = renderFolioContent(f, curIndex);
      activePage.classList.remove('turn-left', 'turn-right');
      activePage.classList.add('rest');

      resizeInkCanvas();
      loadFolioStrokes();
      updateUI();
      emitFolioEvent();

      setTimeout(() => { isFlipping = false; }, 300);
    }, dir === 'none' ? 0 : 220);
  }

  function updateUI() {
    const pct = folios.length > 1 ? Math.round((curIndex / (folios.length - 1)) * 100) : 100;
    pctDisplay.textContent = `${pct}%`;
    rangeInput.value = curIndex;
    countDisplay.textContent = `${String(curIndex + 1).padStart(2, '0')} / ${folios.length}`;
    if (folios[curIndex]) catBadge.textContent = folios[curIndex].category;
    if (penFolioBadge) penFolioBadge.textContent = `Folio ${curIndex + 1}`;

    const items = $('tocList').querySelectorAll('.toc-item');
    items.forEach((it, idx) => it.classList.toggle('active', idx === curIndex));
  }

  function emitFolioEvent() {
    if (isEmbedded) {
      window.parent.postMessage({
        type: 'HTMLARTS_EVENT',
        payload: {
          event: 'folio-changed',
          bookId,
          folioIndex: curIndex,
          totalFolios: folios.length,
          folioTitle: folios[curIndex]?.title || ''
        }
      }, '*');
    }
  }

  /* ── 4. Main Page Pen Station Integration ── */
  function sizeCanvas() {
    if (!activePage) return;
    const rect = activePage.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    inkCanvas.width = Math.round(rect.width * dpr);
    inkCanvas.height = Math.round(rect.height * dpr);
    inkCanvas.style.width = rect.width + 'px';
    inkCanvas.style.height = rect.height + 'px';
    inkCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function resizeInkCanvas() {
    sizeCanvas();
    redrawInk();
  }

  function getFolioKey() {
    return `${bookId}_folio_${curIndex}`;
  }

  function loadFolioStrokes() {
    const k = getFolioKey();
    if (!pageStrokes[k]) {
      try {
        pageStrokes[k] = JSON.parse(localStorage.getItem('htmlarts_ink_' + k) || '[]');
      } catch(e) { pageStrokes[k] = []; }
    }
    redrawInk();
  }

  function saveFolioStrokes() {
    const k = getFolioKey();
    try {
      localStorage.setItem('htmlarts_ink_' + k, JSON.stringify(pageStrokes[k] || []));
    } catch(e) {}
    if (isEmbedded) {
      window.parent.postMessage({
        type: 'HTMLARTS_EVENT',
        payload: {
          event: 'annotations-updated',
          bookId,
          data: { strokes: pageStrokes[k] || [] }
        }
      }, '*');
    }
  }

  function setPenState(active) {
    penActive = active;
    inkCanvas.classList.toggle('pen-active', penActive);
    penStation.classList.toggle('active', penActive);
    $('btnPen').classList.toggle('active', penActive);
    masterNibBtn.classList.toggle('resting', !penActive);
    masterNibLabel.textContent = penActive ? 'Nib (Active)' : 'Nib (Resting)';
    if (penActive) resizeInkCanvas();
  }

  function drawStroke(s) {
    if (!s || !s.pts || s.pts.length < 1) return;
    const rect = activePage.getBoundingClientRect();
    inkCtx.save();
    inkCtx.strokeStyle = s.color || currentColor;
    inkCtx.lineWidth = s.width || 2.8;
    inkCtx.lineCap = 'round';
    inkCtx.lineJoin = 'round';
    inkCtx.beginPath();
    const [sx, sy] = [s.pts[0].x * rect.width, s.pts[0].y * rect.height];
    inkCtx.moveTo(sx, sy);
    for (let i = 1; i < s.pts.length; i++) {
      const px = s.pts[i].x * rect.width;
      const py = s.pts[i].y * rect.height;
      inkCtx.lineTo(px, py);
    }
    inkCtx.stroke();
    inkCtx.restore();
  }

  function redrawInk() {
    const rect = activePage.getBoundingClientRect();
    inkCtx.clearRect(0, 0, rect.width, rect.height);
    const k = getFolioKey();
    (pageStrokes[k] || []).forEach(drawStroke);
  }

  function normPos(e) {
    const r = inkCanvas.getBoundingClientRect();
    return {
      x: Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)),
      y: Math.max(0, Math.min(1, (e.clientY - r.top) / r.height))
    };
  }

  inkCanvas.addEventListener('pointerdown', e => {
    if (!penActive) return;
    e.preventDefault();
    e.stopPropagation();
    if (inkCanvas.setPointerCapture) inkCanvas.setPointerCapture(e.pointerId);

    activeStroke = {
      color: currentColor,
      width: 2.8,
      pts: [normPos(e)]
    };
  });

  inkCanvas.addEventListener('pointermove', e => {
    if (!penActive || !activeStroke) return;
    activeStroke.pts.push(normPos(e));
    redrawInk();
    drawStroke(activeStroke);
  });

  function finishStroke() {
    if (!activeStroke) return;
    const k = getFolioKey();
    if (!pageStrokes[k]) pageStrokes[k] = [];
    if (activeStroke.pts.length >= 2) {
      pageStrokes[k].push(activeStroke);
      saveFolioStrokes();
    }
    activeStroke = null;
    redrawInk();
  }
  inkCanvas.addEventListener('pointerup', finishStroke);
  inkCanvas.addEventListener('pointercancel', finishStroke);

  function undoStroke() {
    const k = getFolioKey();
    if (pageStrokes[k] && pageStrokes[k].length > 0) {
      currentRedo.push(pageStrokes[k].pop());
      saveFolioStrokes();
      redrawInk();
    }
  }
  function redoStroke() {
    const k = getFolioKey();
    if (currentRedo.length > 0) {
      if (!pageStrokes[k]) pageStrokes[k] = [];
      pageStrokes[k].push(currentRedo.pop());
      saveFolioStrokes();
      redrawInk();
    }
  }

  /* ── 5. Gesture Engine & Pointer Flipping ── */
  let down = null;
  stage.addEventListener('pointerdown', e => {
    if (penActive || readingMode === 'continuous') return;
    if (e.target.closest('button, input, a, select')) return;
    down = { x: e.clientX, y: e.clientY, t: Date.now() };
  });

  stage.addEventListener('pointerup', e => {
    if (!down || penActive || readingMode === 'continuous') return;
    const dx = e.clientX - down.x;
    const dy = e.clientY - down.y;
    down = null;

    if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 50) return;

    if (dx < -48) {
      jump(curIndex + 1, 'forward');
    } else if (dx > 48) {
      jump(curIndex - 1, 'backward');
    } else if (Math.abs(dx) < 10) {
      const rect = stage.getBoundingClientRect();
      const relX = e.clientX - rect.left;
      if (relX > rect.width * 0.85) jump(curIndex + 1, 'forward');
      else if (relX < rect.width * 0.15) jump(curIndex - 1, 'backward');
    }
  });

  /* ── 6. UI Controls Binding ── */
  // ← Catalog Button: sends close event to parent to return straight to catalog
  $('btnBackToCatalog').onclick = () => {
    if (isEmbedded) {
      window.parent.postMessage({ type: 'HTMLARTS_EVENT', payload: { event: 'close' } }, '*');
    } else {
      window.location.href = './index.html#catalog';
    }
  };

  $('tocToggleBtn').onclick = openToc;
  $('btnTocClose').onclick = closeToc;
  $('tocBackdrop').onclick = closeToc;
  $('tocSearch').oninput = e => filterToc(e.target.value);

  // Pen Toggle Button in Header
  $('btnPen').onclick = () => {
    setPenState(!penActive);
  };

  // Master Nib in Pen Dock
  masterNibBtn.onclick = () => {
    setPenState(!penActive);
  };

  // Archival Ink Drops
  document.querySelectorAll('.inkwell-palette .ink-drop').forEach(drop => {
    drop.onclick = () => {
      document.querySelectorAll('.inkwell-palette .ink-drop').forEach(d => d.classList.remove('active'));
      drop.classList.add('active');
      currentColor = drop.dataset.color;
    };
  });

  $('btnUndoFolio').onclick = undoStroke;
  $('btnRedoFolio').onclick = redoStroke;
  $('btnClearFolio').onclick = () => {
    const k = getFolioKey();
    if (pageStrokes[k]?.length && confirm(`Clear all ink notes on Folio ${curIndex + 1}?`)) {
      currentRedo = [...pageStrokes[k]];
      pageStrokes[k] = [];
      saveFolioStrokes();
      redrawInk();
    }
  };

  // Download Note as Transparent PNG
  $('btnDownloadNotes').onclick = () => {
    const link = document.createElement('a');
    link.download = `HtmlArts-Folio-${curIndex + 1}-notes.png`;
    link.href = inkCanvas.toDataURL('image/png');
    link.click();
  };

  // Layout Mode Toggle
  $('btnMode').onclick = () => {
    if (readingMode === 'paginated') {
      readingMode = 'continuous';
      document.body.classList.add('mode-continuous');
      $('btnMode').title = 'Switch to 3D Paginated Mode (M)';
      chassis.innerHTML = folios.map((f, i) => `
        <article class="page-sheet" data-folio-index="${i}">
          ${renderFolioContent(f, i)}
        </article>
      `).join('');
    } else {
      readingMode = 'paginated';
      document.body.classList.remove('mode-continuous');
      $('btnMode').title = 'Switch to Continuous Mode (M)';
      window.location.reload();
    }
  };

  // Theme Cycler
  $('btnTheme').onclick = () => {
    document.body.classList.remove(themes[currentThemeIdx]);
    currentThemeIdx = (currentThemeIdx + 1) % themes.length;
    document.body.classList.add(themes[currentThemeIdx]);
  };

  // Zen Fullscreen
  $('btnZen').onclick = () => {
    document.body.classList.add('zen-mode');
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
  };
  $('btnExitZen').onclick = () => {
    document.body.classList.remove('zen-mode');
    if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
  };

  // Download Book
  $('btnDownload').onclick = () => {
    const blob = new Blob([rawBookHtml || document.documentElement.outerHTML], { type: 'text/html;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (titleEl.textContent.trim().replace(/\s+/g, '-') || 'HtmlArts-Book') + '.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };

  // Steppers
  $('btnFirstPage').onclick = () => jump(0, 'backward');
  $('btnLastPage').onclick = () => jump(folios.length - 1, 'forward');
  $('timelineRange').oninput = e => jump(parseInt(e.target.value, 10), parseInt(e.target.value, 10) > curIndex ? 'forward' : 'backward');

  // Keyboard Shortcuts
  window.addEventListener('keydown', e => {
    if (['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
    if (e.key === 'Escape') {
      if ($('tocDrawer').classList.contains('open')) closeToc();
      else if (penActive) setPenState(false);
      else if (document.body.classList.contains('zen-mode')) $('btnExitZen').click();
      else $('btnBackToCatalog').click();
    }
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); jump(curIndex + 1, 'forward'); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); jump(curIndex - 1, 'backward'); }
    if (e.key === 'Home') { e.preventDefault(); jump(0, 'backward'); }
    if (e.key === 'End') { e.preventDefault(); jump(folios.length - 1, 'forward'); }
    if (e.key === 'i' || e.key === 'I') { e.preventDefault(); $('tocToggleBtn').click(); }
    if (e.key === 'p' || e.key === 'P') { e.preventDefault(); $('btnPen').click(); }
    if (e.key === 't' || e.key === 'T') { e.preventDefault(); $('btnTheme').click(); }
    if (e.key === 'm' || e.key === 'M') { e.preventDefault(); $('btnMode').click(); }
    if (e.key === 'f' || e.key === 'F') { e.preventDefault(); $('btnZen').click(); }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
      e.preventDefault();
      if (e.shiftKey) redoStroke(); else undoStroke();
    }
  });

  window.addEventListener('resize', () => { requestAnimationFrame(resizeInkCanvas); });

  /* ── 7. Bidirectional PostMessage Bridge with Server ── */
  window.addEventListener('message', e => {
    const d = e.data;
    if (!d || !d.type) return;

    if (d.type === 'HTMLARTS_LOAD') {
      const p = d.payload || {};
      bookId = p.bookId || 'book-01';
      extractFolios(p.html || '', p.metadata || {});
      if (isEmbedded) {
        window.parent.postMessage({ type: 'HTMLARTS_EVENT', payload: { event: 'book-ready', bookId } }, '*');
      }
    }
    if (d.type === 'HTMLARTS_NAV') {
      if (d.page === 'next') jump(curIndex + 1, 'forward');
      else if (d.page === 'prev') jump(curIndex - 1, 'backward');
      else if (typeof d.page === 'number') jump(d.page);
    }
  });

  // Standalone File Dropzone
  function initStandaloneFallback() {
    if (isEmbedded) return;
    $('dropFallback').classList.add('open');
    const box = $('dropzoneBox');
    const input = $('fileInputFallback');
    box.onclick = () => input.click();
    input.onchange = async () => {
      if (input.files.length) {
        const text = await input.files[0].text();
        $('dropFallback').classList.remove('open');
        extractFolios(text, { title: input.files[0].name.replace(/\.html?$/i, '') });
      }
    };
  }
  initStandaloneFallback();

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }
})();
</script>
</body>
</html>
